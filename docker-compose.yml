services:
  api:
    build: .
    ports:
      - "8000:8000"
    env_file: .env
    volumes:
      - ./data:/app/data
      - ./chroma_store:/app/chroma_store

  ui:
    build: .
    command: streamlit run ui/streamlit_app.py --server.port 8501 --server.address 0.0.0.0
    ports:
      - "8501:8501"
    env_file: .env
    environment:
      - API_URL=http://api:8000
    depends_on:
      - api

# First run ingests the sample PDFs into the shared Chroma volume:
#   docker compose run --rm api python -m app.ingest
# then:
#   docker compose up
